name: FilterTV APK
on:
  push:
    branches: [master, main, filtertv]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android packages
        run: sdkmanager "platforms;android-34" "build-tools;30.0.3" "ndk;21.0.6113669"
      - name: Test request filtering
        run: python3 tools/test-filter.py
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleStfdroidDebug
      - name: Lint
        run: ./gradlew --no-daemon lintStfdroidDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FilterTV-debug-apks
          path: smarttubetv/build/outputs/apk/stfdroid/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: '**/build/reports/lint-results-*.html'
