name: FilterTV APK
on:
  push:
    branches: [master, main, filtertv]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Disable debug HTTP body capture in SharedModules
        run: git -C SharedModules apply ../patches/sharedmodules-disable-debug-http-profiler.patch
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned Android packages
        run: sdkmanager "platforms;android-34" "build-tools;30.0.3" "ndk;21.0.6113669"
      - name: Test Brave network matcher
        run: cargo test --manifest-path bravefilter/Cargo.toml --locked
      - name: Build Brave Android libraries
        run: bash tools/build-brave-native.sh
      - name: Test request filtering
        run: python3 tools/test-filter.py
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleStfdroidDebug
      - name: Verify Brave library is packaged for each supported ABI
        run: |
          apk=$(find smarttubetv/build/outputs/apk/stfdroid/debug -name '*universal*.apk' -print -quit)
          test -n "$apk"
          for abi in arm64-v8a armeabi-v7a x86; do
            unzip -l "$apk" "lib/$abi/libfiltertv_adblock.so" | grep -q libfiltertv_adblock.so
          done
      - name: Lint
        run: ./gradlew --no-daemon lintStfdroidDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test Android transports and packaged Brave engine
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          script: ./gradlew --no-daemon :smarttubetv:connectedStfdroidDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: FilterTV-debug-apks
          path: smarttubetv/build/outputs/apk/stfdroid/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: '**/build/reports/lint-results-*.html'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-report
          path: smarttubetv/build/reports/androidTests/
